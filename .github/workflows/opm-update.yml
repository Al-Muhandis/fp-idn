name: OPM release automation

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-and-manifest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # commit the manifest to main, not to the tag
          fetch-depth: 0

      # A release is: bump the version in fpidn_rt.lpk, tag v<version>, push.
      # The manifest must point at a tag whose archive really contains that
      # lpk version, otherwise OPM users get a permanent update notification.
      - name: Regenerate OPM update manifest
        id: gen
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python3 tools/update_opm_json.py --expect-tag "${{ github.ref_name }}"
          else
            python3 tools/update_opm_json.py
          fi
          echo "version=$(python3 tools/update_opm_json.py --print-version)" >> "$GITHUB_OUTPUT"

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          if git diff --quiet -- update_FpIdn.json; then
            echo "manifest already up to date, nothing to commit"
          else
            git add update_FpIdn.json
            git commit -m "chore: OPM update manifest for v${{ steps.gen.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && exit 0
          gh release create "${{ github.ref_name }}" \
            --title "fp-idn v${{ steps.gen.outputs.version }}" \
            --generate-notes
